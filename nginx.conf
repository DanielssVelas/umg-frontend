# HTTP: redirigir a HTTPS
server {
    listen 80;
    server_name umg.dvsistems.shop;

    # Validación y renovación de Let's Encrypt
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS: aplicación principal
server {
    listen 443 ssl;
    server_name umg.dvsistems.shop;

    ssl_certificate /etc/letsencrypt/live/umg.dvsistems.shop/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/umg.dvsistems.shop/privkey.pem;

    root /usr/share/nginx/html;
    index index.html;

    # React Router
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API Node.js
    location /api/ {
        proxy_pass http://umg-backend:4001/;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}